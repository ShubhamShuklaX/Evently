services:
  - type: web
    name: evently-api
    runtime: node
    rootDir: server
    buildCommand: npm ci && npx prisma generate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ORGANIZER_PASSWORD
        sync: false
